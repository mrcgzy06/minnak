<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="50%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Monkey Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="120" cy="150" r="30" fill="#795548"/>
    <circle cx="280" cy="150" r="30" fill="#795548"/>
    <circle cx="120" cy="150" r="18" fill="#ffccbc"/>
    <circle cx="280" cy="150" r="18" fill="#ffccbc"/>
    <!-- Head -->
    <circle cx="200" cy="150" r="70" fill="#795548"/>
    <!-- Face mask -->
    <path d="M 160 120 C 160 90, 200 100, 200 125 C 200 100, 240 90, 240 120 C 250 160, 230 200, 200 200 C 170 200, 150 160, 160 120 Z" fill="#ffccbc"/>
    <!-- Eyes -->
    <circle cx="175" cy="130" r="10" fill="#2c3e50"/>
    <circle cx="225" cy="130" r="10" fill="#2c3e50"/>
    <circle cx="178" cy="127" r="4" fill="#ffffff"/>
    <circle cx="228" cy="127" r="4" fill="#ffffff"/>
    <!-- Nose & Mouth -->
    <ellipse cx="200" cy="155" rx="8" ry="6" fill="#5d4037"/>
    <path d="M 185 170 Q 200 185 215 170" stroke="#5d4037" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Banana -->
    <path d="M 230 200 Q 260 210 270 240 Q 240 240 220 210 Z" fill="#f1c40f" stroke="#f39c12" stroke-width="2"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#e67e22" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Neşeli Maymun 🐒</text>
</svg>
