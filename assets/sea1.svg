<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="50%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Dolphin Character -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <path d="M 100 220 Q 150 80 280 120 Q 320 180 220 220 C 170 230 120 250 100 220 Z" fill="#29b6f6"/>
    <path d="M 120 210 Q 160 130 250 150 Q 220 210 140 215 Z" fill="#e0f7fa"/>
    <!-- Tail -->
    <path d="M 100 220 L 60 200 L 70 230 L 60 260 Z" fill="#0288d1"/>
    <!-- Fin -->
    <path d="M 190 105 Q 220 70 230 110 Z" fill="#0288d1"/>
    <!-- Snout & Mouth -->
    <path d="M 280 120 Q 320 135 290 150 Z" fill="#29b6f6"/>
    <!-- Eye -->
    <circle cx="250" cy="135" r="9" fill="#01579b"/>
    <circle cx="252" cy="133" r="3" fill="#ffffff"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#0288d1" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Zeki Yunus 🐬</text>
</svg>
