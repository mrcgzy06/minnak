<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="50%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Panda Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="130" cy="90" r="30" fill="#212121"/>
    <circle cx="270" cy="90" r="30" fill="#212121"/>
    <!-- Head -->
    <ellipse cx="200" cy="160" rx="80" ry="70" fill="#ffffff"/>
    <!-- Eye Patches -->
    <ellipse cx="160" cy="145" rx="22" ry="18" transform="rotate(-15 160 145)" fill="#212121"/>
    <ellipse cx="240" cy="145" rx="22" ry="18" transform="rotate(15 240 145)" fill="#212121"/>
    <!-- Eyes -->
    <circle cx="163" cy="143" r="7" fill="#ffffff"/>
    <circle cx="237" cy="143" r="7" fill="#ffffff"/>
    <circle cx="164" cy="143" r="4" fill="#212121"/>
    <circle cx="236" cy="143" r="4" fill="#212121"/>
    <!-- Snout & Mouth -->
    <ellipse cx="200" cy="175" rx="14" ry="10" fill="#212121"/>
    <path d="M 188 190 Q 200 200 212 190" stroke="#212121" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="135" cy="170" r="10" fill="#ff7675" opacity="0.4"/>
    <circle cx="265" cy="170" r="10" fill="#ff7675" opacity="0.4"/>
    <!-- Bamboo -->
    <rect x="230" y="190" width="12" height="60" rx="6" fill="#4caf50" transform="rotate(-30 230 190)"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#212121" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Tombul Panda 🐼</text>
</svg>
