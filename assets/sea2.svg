<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="50%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Octopus Character -->
  <g filter="url(#shadow)">
    <!-- Tentacles -->
    <path d="M 120 220 Q 90 270 130 280 Q 150 250 160 210 Z" fill="#ab47bc"/>
    <path d="M 160 220 Q 150 290 190 290 Q 200 250 200 210 Z" fill="#ab47bc"/>
    <path d="M 210 220 Q 230 290 270 280 Q 250 240 240 210 Z" fill="#ab47bc"/>
    <path d="M 240 220 Q 300 260 280 220 Q 250 210 250 190 Z" fill="#ab47bc"/>
    <!-- Head -->
    <circle cx="200" cy="150" r="75" fill="#ab47bc"/>
    <!-- Eyes -->
    <circle cx="170" cy="140" r="14" fill="#ffffff"/>
    <circle cx="230" cy="140" r="14" fill="#ffffff"/>
    <circle cx="173" cy="140" r="7" fill="#4a148c"/>
    <circle cx="233" cy="140" r="7" fill="#4a148c"/>
    <!-- Cheeks -->
    <circle cx="145" cy="165" r="10" fill="#ff4081" opacity="0.5"/>
    <circle cx="255" cy="165" r="10" fill="#ff4081" opacity="0.5"/>
    <!-- Smile -->
    <path d="M 185 170 Q 200 185 215 170" stroke="#4a148c" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#8e24aa" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Sevimli Ahtapot 🐙</text>
</svg>
