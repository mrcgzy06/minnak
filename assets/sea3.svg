<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e0f2f1"/>
      <stop offset="50%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#004d40"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Shark Character -->
  <g filter="url(#shadow)">
    <!-- Fin -->
    <path d="M 180 110 Q 200 40 230 90 Z" fill="#37474f"/>
    <!-- Tail -->
    <path d="M 90 190 L 50 140 L 65 190 L 45 230 Z" fill="#37474f"/>
    <!-- Body -->
    <path d="M 80 190 Q 180 100 310 160 Q 320 230 180 230 Z" fill="#546e7a"/>
    <path d="M 140 200 Q 230 200 300 180 Q 260 230 180 230 Z" fill="#ffffff"/>
    <!-- Eye -->
    <circle cx="265" cy="155" r="9" fill="#263238"/>
    <circle cx="267" cy="153" r="3" fill="#ffffff"/>
    <!-- Big Smile -->
    <path d="M 230 190 Q 270 210 295 180" stroke="#263238" stroke-width="3" fill="none"/>
    <polygon points="250,195 255,203 260,195" fill="#ffffff"/>
    <polygon points="265,193 270,201 275,193" fill="#ffffff"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#37474f" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Hızlı Köpekbalığı 🦈</text>
</svg>
