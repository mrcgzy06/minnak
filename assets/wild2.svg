<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="50%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="140" fill="#ffffff" opacity="0.3"/>
  <!-- Elephant Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <ellipse cx="110" cy="150" rx="55" ry="65" fill="#95a5a6"/>
    <ellipse cx="290" cy="150" rx="55" ry="65" fill="#95a5a6"/>
    <ellipse cx="115" cy="150" rx="35" ry="45" fill="#ff7675" opacity="0.4"/>
    <ellipse cx="285" cy="150" rx="35" ry="45" fill="#ff7675" opacity="0.4"/>
    <!-- Head -->
    <ellipse cx="200" cy="160" rx="75" ry="70" fill="#bdc3c7"/>
    <!-- Eyes -->
    <circle cx="165" cy="135" r="12" fill="#2c3e50"/>
    <circle cx="235" cy="135" r="12" fill="#2c3e50"/>
    <circle cx="168" cy="132" r="4" fill="#ffffff"/>
    <circle cx="238" cy="132" r="4" fill="#ffffff"/>
    <!-- Trunk -->
    <path d="M 190 165 C 185 210, 220 220, 235 195 C 240 185, 230 175, 220 185 C 210 195, 202 180, 205 165 Z" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <!-- Water Splashes -->
    <circle cx="245" cy="165" r="7" fill="#2980b9"/>
    <circle cx="260" cy="150" r="5" fill="#3498db"/>
    <circle cx="255" cy="175" r="4" fill="#5dede7"/>
    <!-- Cheeks -->
    <circle cx="145" cy="160" r="9" fill="#ff7675" opacity="0.5"/>
    <circle cx="255" cy="160" r="9" fill="#ff7675" opacity="0.5"/>
  </g>
  <!-- Card Title Banner -->
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#0984e3" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Sevimli Fil 🐘</text>
</svg>
