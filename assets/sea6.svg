<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffebee"/>
      <stop offset="50%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Crab Character -->
  <g filter="url(#shadow)">
    <!-- Claws -->
    <path d="M 120 120 C 80 80, 70 140, 110 160 Z" fill="#d32f2f"/>
    <path d="M 280 120 C 320 80, 330 140, 290 160 Z" fill="#d32f2f"/>
    <!-- Eyes on Stalks -->
    <rect x="160" y="90" width="10" height="30" rx="5" fill="#e53935"/>
    <rect x="230" y="90" width="10" height="30" rx="5" fill="#e53935"/>
    <circle cx="165" cy="85" r="14" fill="#ffffff"/>
    <circle cx="235" cy="85" r="14" fill="#ffffff"/>
    <circle cx="167" cy="85" r="7" fill="#212121"/>
    <circle cx="237" cy="85" r="7" fill="#212121"/>
    <!-- Shell Body -->
    <ellipse cx="200" cy="170" rx="75" ry="50" fill="#e53935"/>
    <!-- Legs -->
    <path d="M 130 180 Q 90 200 110 230" stroke="#b71c1c" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 270 180 Q 310 200 290 230" stroke="#b71c1c" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Smile -->
    <path d="M 180 180 Q 200 195 220 180" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#c62828" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Kırmızı Yengeç 🦀</text>
</svg>
