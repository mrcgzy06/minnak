<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="50%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ef6c00"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Bear Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="130" cy="90" r="28" fill="#6d4c41"/>
    <circle cx="270" cy="90" r="28" fill="#6d4c41"/>
    <circle cx="130" cy="90" r="16" fill="#bcaaa4"/>
    <circle cx="270" cy="90" r="16" fill="#bcaaa4"/>
    <!-- Head -->
    <ellipse cx="200" cy="160" rx="80" ry="72" fill="#795548"/>
    <!-- Snout -->
    <ellipse cx="200" cy="180" rx="42" ry="32" fill="#d7ccc8"/>
    <ellipse cx="200" cy="170" rx="14" ry="10" fill="#3e2723"/>
    <!-- Eyes -->
    <circle cx="165" cy="140" r="10" fill="#3e2723"/>
    <circle cx="235" cy="140" r="10" fill="#3e2723"/>
    <circle cx="168" cy="137" r="4" fill="#ffffff"/>
    <circle cx="238" cy="137" r="4" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M 188 190 Q 200 202 212 190" stroke="#3e2723" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#5d4037" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Ayı Bobo 🐻</text>
</svg>
