<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="50%" stop-color="#ffecb3"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Oyster Character -->
  <g filter="url(#shadow)">
    <!-- Shell Top -->
    <path d="M 120 160 Q 200 60 280 160 Z" fill="#b0bec5" stroke="#78909c" stroke-width="4"/>
    <!-- Shell Bottom -->
    <path d="M 120 160 Q 200 240 280 160 Z" fill="#90a4ae" stroke="#607d8b" stroke-width="4"/>
    <!-- Pearl -->
    <circle cx="200" cy="155" r="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="3"/>
    <circle cx="208" cy="148" r="8" fill="#e0f7fa"/>
    <!-- Eyes on Pearl -->
    <circle cx="190" cy="155" r="4" fill="#212121"/>
    <circle cx="210" cy="155" r="4" fill="#212121"/>
    <path d="M 195 163 Q 200 168 205 163" stroke="#212121" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#ffa000" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">İnci İstiridye 🦪</text>
</svg>
