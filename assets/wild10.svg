<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f4c3"/>
      <stop offset="50%" stop-color="#d4e157"/>
      <stop offset="100%" stop-color="#9e9d24"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Frog Character -->
  <g filter="url(#shadow)">
    <!-- Eye bumps -->
    <circle cx="145" cy="100" r="32" fill="#8bc34a"/>
    <circle cx="255" cy="100" r="32" fill="#8bc34a"/>
    <circle cx="145" cy="100" r="18" fill="#ffffff"/>
    <circle cx="255" cy="100" r="18" fill="#ffffff"/>
    <circle cx="147" cy="100" r="9" fill="#212121"/>
    <circle cx="257" cy="100" r="9" fill="#212121"/>
    <circle cx="150" cy="97" r="3" fill="#ffffff"/>
    <circle cx="260" cy="97" r="3" fill="#ffffff"/>
    <!-- Head -->
    <ellipse cx="200" cy="170" rx="90" ry="70" fill="#8bc34a"/>
    <!-- Cheeks -->
    <circle cx="130" cy="175" r="14" fill="#ff7675" opacity="0.5"/>
    <circle cx="270" cy="175" r="14" fill="#ff7675" opacity="0.5"/>
    <!-- Mouth -->
    <path d="M 140 170 Q 200 230 260 170" stroke="#33691e" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#558b2f" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Zıpzıp Kurbağa 🐸</text>
</svg>
