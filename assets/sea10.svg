<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffebee"/>
      <stop offset="50%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Lobster Character -->
  <g filter="url(#shadow)">
    <!-- Claws -->
    <path d="M 130 110 C 90 60, 60 120, 110 140 Z" fill="#d32f2f"/>
    <path d="M 270 110 C 310 60, 340 120, 290 140 Z" fill="#d32f2f"/>
    <!-- Head -->
    <ellipse cx="200" cy="150" rx="55" ry="50" fill="#e53935"/>
    <!-- Tail Segments -->
    <ellipse cx="200" cy="205" rx="45" ry="25" fill="#d32f2f"/>
    <ellipse cx="200" cy="235" rx="35" ry="20" fill="#c62828"/>
    <!-- Eyes -->
    <circle cx="180" cy="130" r="8" fill="#ffffff"/>
    <circle cx="220" cy="130" r="8" fill="#ffffff"/>
    <circle cx="182" cy="130" r="4" fill="#212121"/>
    <circle cx="222" cy="130" r="4" fill="#212121"/>
    <!-- Smile -->
    <path d="M 190 150 Q 200 160 210 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#c62828" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Kırmızı Istakoz 🦞</text>
</svg>
