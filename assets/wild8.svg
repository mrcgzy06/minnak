<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="50%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Tiger Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="130" cy="85" r="26" fill="#fb8c00"/>
    <circle cx="270" cy="85" r="26" fill="#fb8c00"/>
    <circle cx="130" cy="85" r="14" fill="#ffe0b2"/>
    <circle cx="270" cy="85" r="14" fill="#ffe0b2"/>
    <!-- Head -->
    <ellipse cx="200" cy="155" rx="78" ry="70" fill="#f57c00"/>
    <!-- Stripes -->
    <path d="M 200 85 L 195 105 L 205 105 Z" fill="#212121"/>
    <path d="M 140 120 L 160 125 L 142 135 Z" fill="#212121"/>
    <path d="M 260 120 L 240 125 L 258 135 Z" fill="#212121"/>
    <!-- Snout -->
    <ellipse cx="200" cy="175" rx="38" ry="28" fill="#ffffff"/>
    <path d="M 190 162 Q 200 155 210 162 Q 200 178 190 162 Z" fill="#212121"/>
    <!-- Eyes -->
    <circle cx="165" cy="135" r="11" fill="#212121"/>
    <circle cx="235" cy="135" r="11" fill="#212121"/>
    <circle cx="168" cy="132" r="4" fill="#ffffff"/>
    <circle cx="238" cy="132" r="4" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M 188 185 Q 200 196 212 185" stroke="#212121" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#e65100" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Hızlı Kaplan 🐯</text>
</svg>
