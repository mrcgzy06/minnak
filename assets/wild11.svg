<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="50%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#d84315"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Parrot Character -->
  <g filter="url(#shadow)">
    <!-- Feather Crest -->
    <path d="M 190 40 Q 200 10 220 30 Q 200 60 190 40 Z" fill="#f44336"/>
    <path d="M 180 50 Q 185 20 205 40 Z" fill="#ffeb3b"/>
    <!-- Head -->
    <ellipse cx="200" cy="140" rx="65" ry="60" fill="#e53935"/>
    <!-- Face patch -->
    <ellipse cx="180" cy="135" rx="35" ry="30" fill="#ffffff"/>
    <!-- Eyes -->
    <circle cx="175" cy="130" r="10" fill="#212121"/>
    <circle cx="178" cy="127" r="4" fill="#ffffff"/>
    <!-- Beak -->
    <path d="M 175 145 Q 120 170 170 195 Q 190 195 185 155 Z" fill="#fbc02d" stroke="#f57f17" stroke-width="2"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#d32f2f" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Renkli Papağan 🦜</text>
</svg>
