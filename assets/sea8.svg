<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Clownfish Character -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="200" cy="170" rx="85" ry="60" fill="#fb8c00"/>
    <!-- Stripes -->
    <path d="M 160 115 Q 170 170 160 225 L 180 225 Q 190 170 180 115 Z" fill="#ffffff" stroke="#212121" stroke-width="2"/>
    <path d="M 220 115 Q 230 170 220 225 L 235 225 Q 245 170 235 115 Z" fill="#ffffff" stroke="#212121" stroke-width="2"/>
    <!-- Tail -->
    <path d="M 115 170 L 65 130 L 75 170 L 65 210 Z" fill="#f57c00" stroke="#212121" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="255" cy="155" r="9" fill="#212121"/>
    <circle cx="257" cy="153" r="3" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M 245 180 Q 260 195 275 180" stroke="#212121" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#ef6c00" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Palyaço Balığı 🐠</text>
</svg>
