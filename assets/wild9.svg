<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="50%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Crocodile Character -->
  <g filter="url(#shadow)">
    <!-- Eye Ridges -->
    <circle cx="160" cy="105" r="22" fill="#4caf50"/>
    <circle cx="240" cy="105" r="22" fill="#4caf50"/>
    <circle cx="160" cy="105" r="12" fill="#ffffff"/>
    <circle cx="240" cy="105" r="12" fill="#ffffff"/>
    <circle cx="162" cy="105" r="6" fill="#212121"/>
    <circle cx="242" cy="105" r="6" fill="#212121"/>
    <!-- Head & Snout -->
    <path d="M 140 125 C 140 90, 260 90, 260 125 L 250 250 C 250 280, 150 280, 150 250 Z" fill="#4caf50"/>
    <!-- Nostrils -->
    <circle cx="180" cy="245" r="5" fill="#1b5e20"/>
    <circle cx="220" cy="245" r="5" fill="#1b5e20"/>
    <!-- Big Smile with Teeth -->
    <path d="M 155 200 Q 200 230 245 200" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" fill="none"/>
    <polygon points="175,200 180,212 185,200" fill="#ffffff"/>
    <polygon points="215,200 220,212 225,200" fill="#ffffff"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#2e7d32" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Yeşil Timsah 🐊</text>
</svg>
