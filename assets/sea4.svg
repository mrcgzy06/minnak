<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="50%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Whale Character -->
  <g filter="url(#shadow)">
    <!-- Water Fountain -->
    <path d="M 220 100 Q 220 50 190 40 Q 220 60 220 100 Z" fill="#bbdefb"/>
    <path d="M 220 100 Q 230 45 250 45 Q 230 65 220 100 Z" fill="#bbdefb"/>
    <!-- Body -->
    <ellipse cx="200" cy="180" rx="100" ry="75" fill="#1e88e5"/>
    <ellipse cx="200" cy="205" rx="80" ry="45" fill="#ffffff"/>
    <!-- Tail -->
    <path d="M 100 180 Q 60 150 40 130 Q 60 180 40 210 Z" fill="#1565c0"/>
    <!-- Eye -->
    <circle cx="250" cy="165" r="9" fill="#0d47a1"/>
    <circle cx="252" cy="163" r="3" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M 235 185 Q 255 200 275 180" stroke="#0d47a1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="220" cy="185" r="7" fill="#ff7675" opacity="0.5"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#1565c0" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Dev Balina 🐳</text>
</svg>
