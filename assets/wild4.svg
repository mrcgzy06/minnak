<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dcdde1"/>
      <stop offset="100%" stop-color="#718093"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Zebra Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <ellipse cx="140" cy="80" rx="25" ry="40" transform="rotate(-15 140 80)" fill="#f5f6fa" stroke="#2f3640" stroke-width="4"/>
    <ellipse cx="260" cy="80" rx="25" ry="40" transform="rotate(15 260 80)" fill="#f5f6fa" stroke="#2f3640" stroke-width="4"/>
    <!-- Mane -->
    <path d="M 180 50 L 220 50 L 210 130 L 190 130 Z" fill="#2f3640"/>
    <!-- Head -->
    <ellipse cx="200" cy="150" rx="70" ry="75" fill="#f5f6fa"/>
    <!-- Stripes -->
    <path d="M 130 140 Q 160 145 135 160 Z" fill="#2f3640"/>
    <path d="M 270 140 Q 240 145 265 160 Z" fill="#2f3640"/>
    <path d="M 135 110 Q 165 115 140 125 Z" fill="#2f3640"/>
    <path d="M 265 110 Q 235 115 260 125 Z" fill="#2f3640"/>
    <!-- Snout -->
    <ellipse cx="200" cy="190" rx="45" ry="35" fill="#2f3640"/>
    <circle cx="185" cy="180" r="4" fill="#f5f6fa"/>
    <circle cx="215" cy="180" r="4" fill="#f5f6fa"/>
    <path d="M 190 205 Q 200 215 210 205" stroke="#f5f6fa" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <circle cx="170" cy="130" r="11" fill="#2f3640"/>
    <circle cx="230" cy="130" r="11" fill="#2f3640"/>
    <circle cx="173" cy="127" r="4" fill="#ffffff"/>
    <circle cx="233" cy="127" r="4" fill="#ffffff"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#2f3640" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Çizgili Zebra 🦓</text>
</svg>
