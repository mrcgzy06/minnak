<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="50%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Starfish Character -->
  <g filter="url(#shadow)">
    <polygon points="200,50 235,135 325,140 255,195 280,285 200,235 120,285 145,195 75,140 165,135" fill="#ff7043" stroke="#f4511e" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="180" cy="150" r="10" fill="#212121"/>
    <circle cx="220" cy="150" r="10" fill="#212121"/>
    <circle cx="183" cy="147" r="4" fill="#ffffff"/>
    <circle cx="223" cy="147" r="4" fill="#ffffff"/>
    <!-- Cheeks -->
    <circle cx="165" cy="165" r="8" fill="#e91e63" opacity="0.6"/>
    <circle cx="235" cy="165" r="8" fill="#e91e63" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 190 170 Q 200 182 210 170" stroke="#212121" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#f4511e" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Deniz Yıldızı ⭐</text>
</svg>
