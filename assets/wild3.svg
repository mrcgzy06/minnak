<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="60%" stop-color="#fbc531"/>
      <stop offset="100%" stop-color="#e1b12c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Giraffe Character -->
  <g filter="url(#shadow)">
    <!-- Horns -->
    <rect x="175" y="40" width="10" height="35" rx="5" fill="#e67e22"/>
    <circle cx="180" cy="40" r="10" fill="#d35400"/>
    <rect x="215" y="40" width="10" height="35" rx="5" fill="#e67e22"/>
    <circle cx="220" cy="40" r="10" fill="#d35400"/>
    <!-- Ears -->
    <ellipse cx="140" cy="90" rx="30" ry="15" transform="rotate(-20 140 90)" fill="#f39c12"/>
    <ellipse cx="260" cy="90" rx="30" ry="15" transform="rotate(20 260 90)" fill="#f39c12"/>
    <!-- Head & Neck -->
    <path d="M 160 280 L 165 120 C 165 80, 235 80, 235 120 L 240 280 Z" fill="#f1c40f"/>
    <!-- Snout -->
    <ellipse cx="200" cy="180" rx="45" ry="35" fill="#f39c12"/>
    <circle cx="185" cy="175" r="5" fill="#d35400"/>
    <circle cx="215" cy="175" r="5" fill="#d35400"/>
    <!-- Eyes -->
    <circle cx="180" cy="120" r="10" fill="#2c3e50"/>
    <circle cx="220" cy="120" r="10" fill="#2c3e50"/>
    <circle cx="183" cy="117" r="4" fill="#ffffff"/>
    <circle cx="223" cy="117" r="4" fill="#ffffff"/>
    <!-- Spots -->
    <circle cx="180" cy="220" r="12" fill="#d35400"/>
    <circle cx="220" cy="250" r="15" fill="#d35400"/>
    <circle cx="195" cy="275" r="10" fill="#d35400"/>
    <!-- Smile -->
    <path d="M 190 195 Q 200 205 210 195" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#e67e22" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Zarif Zürafa 🦒</text>
</svg>
