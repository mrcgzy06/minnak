<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="50%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Koala Character -->
  <g filter="url(#shadow)">
    <!-- Fluffy Ears -->
    <circle cx="120" cy="95" r="38" fill="#78909c"/>
    <circle cx="280" cy="95" r="38" fill="#78909c"/>
    <circle cx="120" cy="95" r="24" fill="#cfd8dc"/>
    <circle cx="280" cy="95" r="24" fill="#cfd8dc"/>
    <!-- Head -->
    <ellipse cx="200" cy="160" rx="75" ry="65" fill="#90a4ae"/>
    <!-- Large Oval Nose -->
    <ellipse cx="200" cy="165" rx="22" ry="32" fill="#37474f"/>
    <!-- Eyes -->
    <circle cx="160" cy="140" r="9" fill="#263238"/>
    <circle cx="240" cy="140" r="9" fill="#263238"/>
    <circle cx="163" cy="138" r="3" fill="#ffffff"/>
    <circle cx="243" cy="138" r="3" fill="#ffffff"/>
    <!-- Cheeks -->
    <circle cx="140" cy="165" r="10" fill="#ff7675" opacity="0.4"/>
    <circle cx="260" cy="165" r="10" fill="#ff7675" opacity="0.4"/>
  </g>
  <rect x="50" y="320" width="300" height="50" rx="25" fill="#455a64" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="353" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Uykucu Koala 🐨</text>
</svg>
